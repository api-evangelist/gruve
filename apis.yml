aid: gruve
name: Gruve
description: >-
  Gruve Inc. is an AI-driven enterprise services and technology company that helps
  large organizations adopt and secure artificial intelligence. Its portfolio spans
  private AI infrastructure (PulseAI, deployable in under two weeks for data
  sovereignty), AI-powered cybersecurity (AI SOC, digital forensics and incident
  response, and managed AI security services), Data & AI strategy and infrastructure,
  and Customer Experience delivered on Salesforce. Gruve targets enterprises of roughly
  5,000 to 50,000 employees and serves CXOs, IT, security, and data leaders globally.
  Backed by Mayfield, the company operates a public trust center (SafeBase by Drata)
  attesting SOC 2 Type 2, ISO/IEC 27001:2022, and ISO/IEC 42001:2023. This is a
  company/provider record in the API Evangelist network; Gruve is a services and
  platform provider and does not currently publish a public developer API surface.
